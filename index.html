<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compass Robot Control</title>
    <script>
      // Тема до первого кадра (та же логика, что в useTheme), чтобы заставка
      // и интерфейс не мигали белым в тёмной теме.
      ;(function () {
        var mode = 'system'
        try {
          mode = localStorage.getItem('compass.theme') || 'system'
        } catch (_) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      /* Заставка при загрузке: робот строит карту, потом едет к цели.
         Цвета — из docs/DESIGN.md. Убирается из main.js (window.__hideSplash). */
      #cs-splash {
        --cs-bg: #f8fafc;
        --cs-grid: rgba(30, 64, 175, 0.07);
        --cs-dial: #cbd5e1;
        --cs-dial-major: #64748b;
        --cs-floor: #eef2f7;
        --cs-tile: rgba(100, 116, 139, 0.12);
        --cs-rack: #dbe2ea;
        --cs-rack-line: #94a3b8;
        --cs-robot: #1d4ed8;
        --cs-robot-dark: #1e3a8a;
        --cs-edge: #94a3b8;
        --cs-station: #ffffff;
        --cs-order: #0891b2;
        --cs-nav: #059669;
        --cs-text: #64748b;
        --cs-word-a: #1e3a8a;
        --cs-word-b: #2563eb;
        --cs-track: #e2e8f0;
        --cs-accent: #f97316;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          linear-gradient(var(--cs-grid) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(90deg, var(--cs-grid) 1px, transparent 1px) 0 0 / 32px 32px,
          var(--cs-bg);
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 450ms ease, visibility 0s linear 450ms;
      }
      .dark #cs-splash {
        --cs-bg: #020617;
        --cs-grid: rgba(96, 165, 250, 0.06);
        --cs-dial: #1e293b;
        --cs-dial-major: #475569;
        --cs-floor: #0b1324;
        --cs-tile: rgba(148, 163, 184, 0.07);
        --cs-rack: #172033;
        --cs-rack-line: #334155;
        --cs-robot: #3b82f6;
        --cs-robot-dark: #1e40af;
        --cs-edge: #475569;
        --cs-station: #0f172a;
        --cs-order: #22d3ee;
        --cs-nav: #34d399;
        --cs-text: #94a3b8;
        --cs-word-a: #bfdbfe;
        --cs-word-b: #60a5fa;
        --cs-track: #1e293b;
      }
      /* Сетка гаснет к краям экрана. */
      #cs-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, transparent 0, transparent 260px, var(--cs-bg) 600px);
        pointer-events: none;
      }
      #cs-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
      }
      #cs-splash.is-leaving .cs-scene {
        transform: scale(1.06);
      }
      .cs-scene {
        position: relative;
        width: 320px;
        height: 320px;
        transition: transform 450ms ease;
      }
      .cs-scene svg {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .cs-dial {
        transform-origin: 160px 160px;
        animation: cs-settle 2.4s cubic-bezier(0.3, 0.7, 0.3, 1) both;
      }
      /* Один 7-секундный цикл — граф маршрутов склада, как его видит fms:
         0–12 % граф прорисовывается, 12–22 % загорается маршрут задания,
         24–80 % робот едет по рёбрам, 80–92 % доехал, дальше всё гаснет и по кругу. */
      .cs-graph,
      .cs-graph path,
      .cs-stations circle,
      .cs-order,
      .cs-done,
      .cs-robot,
      .cs-goal-ping {
        animation-duration: 7s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .cs-graph {
        animation-name: cs-fade;
      }
      .cs-graph path {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation-name: cs-edges;
      }
      .cs-stations circle {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-name: cs-station;
      }
      .cs-order {
        opacity: 0;
        animation-name: cs-order;
      }
      .cs-done {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation-name: cs-done;
      }
      .cs-robot {
        position: absolute;
        top: 0;
        left: 0;
        width: 40px;
        height: 40px;
        offset-path: path('M 85 210 V 160 H 135 V 110 H 235 V 210');
        offset-anchor: 50% 50%;
        /* Спрайт робота смотрит вверх, поэтому к направлению пути +90°. */
        offset-rotate: auto 90deg;
        opacity: 0;
        animation-name: cs-drive, cs-robot;
      }
      .cs-robot svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 3px 4px rgba(15, 23, 42, 0.35));
      }
      .cs-beam {
        transform-origin: 20px 22px;
        animation: cs-spin 0.9s linear infinite;
      }
      .cs-floor {
        animation: cs-rise 600ms ease both;
      }
      .cs-goal-ping {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-name: cs-ping;
      }
      .cs-brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        animation: cs-rise 600ms 150ms ease both;
      }
      .cs-word {
        font-family: Michroma, Inter, system-ui, sans-serif;
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background-image: linear-gradient(90deg, var(--cs-word-a), var(--cs-word-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .cs-bar {
        width: 3px;
        height: 30px;
        border-radius: 3px;
        background: var(--cs-accent);
      }
      .cs-sub {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--cs-text);
      }
      .cs-tagline {
        position: relative;
        margin-top: -18px;
        font-size: 12px;
        letter-spacing: 0.06em;
        color: var(--cs-text);
        animation: cs-rise 600ms 200ms ease both;
      }
      .cs-progress {
        position: relative;
        width: 220px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--cs-track);
        animation: cs-rise 600ms 250ms ease both;
      }
      .cs-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--cs-word-b) 60%, var(--cs-accent));
        animation: cs-load 1.3s ease-in-out infinite;
      }
      .cs-status {
        position: relative;
        margin-top: -16px;
        min-height: 16px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--cs-text);
        animation: cs-rise 600ms 300ms ease both;
      }
      @keyframes cs-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes cs-settle {
        0% { transform: rotate(-120deg); opacity: 0; }
        35% { transform: rotate(28deg); opacity: 1; }
        55% { transform: rotate(-12deg); }
        72% { transform: rotate(5deg); }
        86% { transform: rotate(-2deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes cs-fade {
        0%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes cs-edges {
        0% { stroke-dashoffset: 100; }
        12%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes cs-station {
        0% { opacity: 0; transform: scale(0.3); }
        9% { opacity: 1; transform: scale(1.25); }
        12%, 92% { opacity: 1; transform: none; }
        98%, 100% { opacity: 0; transform: none; }
      }
      @keyframes cs-order {
        0%, 12% { opacity: 0; }
        16%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      /* Робот и закрашенный путь идут синхронно: зелёным — то, что уже проехали. */
      @keyframes cs-drive {
        0%, 24% { offset-distance: 0%; }
        80%, 100% { offset-distance: 100%; }
      }
      @keyframes cs-robot {
        0%, 18% { opacity: 0; }
        22%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes cs-done {
        0%, 24% { stroke-dashoffset: 100; opacity: 1; }
        80%, 92% { stroke-dashoffset: 0; opacity: 1; }
        98%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes cs-ping {
        0%, 80% { opacity: 0; transform: scale(0.6); }
        81% { opacity: 0.9; transform: scale(0.6); }
        90%, 100% { opacity: 0; transform: scale(2.6); }
      }
      @keyframes cs-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cs-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      /* Без анимации — сразу итог: граф, маршрут пройден, робот на конечной станции. */
      @media (prefers-reduced-motion: reduce) {
        #cs-splash *,
        #cs-splash *::after {
          animation: none !important;
        }
        .cs-graph path, .cs-done { stroke-dashoffset: 0; }
        .cs-stations circle, .cs-order, .cs-robot { opacity: 1; }
        .cs-beam { display: none; }
        .cs-robot { offset-distance: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="cs-splash" role="status" aria-live="polite">
      <div class="cs-scene" aria-hidden="true">
        <svg width="320" height="320" viewBox="0 0 320 320">
          <!-- Пол склада: плитка, стеллажи в клетках между проездами и рядами сверху и снизу -->
          <defs>
            <pattern id="cs-tiles" width="16" height="16" patternUnits="userSpaceOnUse">
              <path d="M 16 0 H 0 V 16" fill="none" stroke="var(--cs-tile)" stroke-width="1" />
            </pattern>
          </defs>
          <g class="cs-floor">
            <circle cx="160" cy="160" r="136" fill="var(--cs-floor)" />
            <circle cx="160" cy="160" r="136" fill="url(#cs-tiles)" />
            <g fill="var(--cs-rack)" stroke="var(--cs-rack-line)" stroke-width="1.5">
              <rect x="96" y="122" width="28" height="26" rx="2" />
              <rect x="146" y="122" width="28" height="26" rx="2" />
              <rect x="196" y="122" width="28" height="26" rx="2" />
              <rect x="96" y="172" width="28" height="26" rx="2" />
              <rect x="146" y="172" width="28" height="26" rx="2" />
              <rect x="196" y="172" width="28" height="26" rx="2" />
              <rect x="90" y="76" width="42" height="16" rx="2" />
              <rect x="139" y="76" width="42" height="16" rx="2" />
              <rect x="188" y="76" width="42" height="16" rx="2" />
              <rect x="90" y="228" width="42" height="16" rx="2" />
              <rect x="139" y="228" width="42" height="16" rx="2" />
              <rect x="188" y="228" width="42" height="16" rx="2" />
            </g>
            <g stroke="var(--cs-rack-line)" stroke-width="1">
              <line x1="96" y1="135" x2="124" y2="135" />
              <line x1="146" y1="135" x2="174" y2="135" />
              <line x1="196" y1="135" x2="224" y2="135" />
              <line x1="96" y1="185" x2="124" y2="185" />
              <line x1="146" y1="185" x2="174" y2="185" />
              <line x1="196" y1="185" x2="224" y2="185" />
              <line x1="111" y1="76" x2="111" y2="92" />
              <line x1="160" y1="76" x2="160" y2="92" />
              <line x1="209" y1="76" x2="209" y2="92" />
              <line x1="111" y1="228" x2="111" y2="244" />
              <line x1="160" y1="228" x2="160" y2="244" />
              <line x1="209" y1="228" x2="209" y2="244" />
            </g>
          </g>

          <!-- Циферблат компаса -->
          <g class="cs-dial">
            <circle cx="160" cy="160" r="154" fill="none" stroke="var(--cs-dial)" stroke-width="1.5" />
            <circle cx="160" cy="160" r="141" fill="none" stroke="var(--cs-dial)" stroke-width="1" stroke-dasharray="1.5 10.8" />
            <g stroke="var(--cs-dial-major)" stroke-width="2" stroke-linecap="round">
              <line x1="160" y1="6" x2="160" y2="18" stroke="var(--cs-accent)" />
              <line x1="314" y1="160" x2="302" y2="160" />
              <line x1="160" y1="314" x2="160" y2="302" />
              <line x1="6" y1="160" x2="18" y2="160" />
            </g>
            <path d="M160 -6 L166 4 H154 Z" fill="var(--cs-accent)" />
            <text x="160" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="var(--cs-accent)" font-family="Inter, system-ui, sans-serif">N</text>
          </g>

          <!-- Граф склада: станции сеткой, проезды между ними — только прямые -->
          <g class="cs-graph" fill="none" stroke="var(--cs-edge)" stroke-width="2" stroke-linecap="round">
            <path pathLength="100" d="M 85 110 H 235 M 85 160 H 235 M 85 210 H 235
                                      M 85 110 V 210 M 135 110 V 210 M 185 110 V 210 M 235 110 V 210" />
          </g>

          <!-- Маршрут задания fms (пунктир) и пройденная часть (зелёным) -->
          <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
            <path class="cs-order" d="M 85 210 V 160 H 135 V 110 H 235 V 210" stroke="var(--cs-order)" stroke-dasharray="6 6" />
            <path class="cs-done" pathLength="100" d="M 85 210 V 160 H 135 V 110 H 235 V 210" stroke="var(--cs-nav)" />
          </g>

          <g class="cs-stations" fill="var(--cs-station)" stroke="var(--cs-edge)" stroke-width="2">
            <circle cx="85" cy="110" r="6" style="animation-delay: 0ms" />
            <circle cx="135" cy="110" r="6" style="animation-delay: 40ms" />
            <circle cx="185" cy="110" r="6" style="animation-delay: 80ms" />
            <circle cx="235" cy="110" r="6" style="animation-delay: 120ms" />
            <circle cx="85" cy="160" r="6" style="animation-delay: 160ms" />
            <circle cx="135" cy="160" r="6" style="animation-delay: 200ms" />
            <circle cx="185" cy="160" r="6" style="animation-delay: 240ms" />
            <circle cx="235" cy="160" r="6" style="animation-delay: 280ms" />
            <circle cx="85" cy="210" r="6" style="animation-delay: 320ms" />
            <circle cx="135" cy="210" r="6" style="animation-delay: 360ms" />
            <circle cx="185" cy="210" r="6" style="animation-delay: 400ms" />
            <circle cx="235" cy="210" r="7" stroke="var(--cs-nav)" stroke-width="2.5" style="animation-delay: 440ms" />
          </g>
          <circle class="cs-goal-ping" cx="235" cy="210" r="9" fill="none" stroke="var(--cs-nav)" stroke-width="2" />
        </svg>

        <!-- Робот сверху, нос вверх: корпус, бампер с фарами, колёса, лидар с лучом -->
        <div class="cs-robot">
          <svg viewBox="0 0 40 40">
            <g fill="#0f172a">
              <rect x="6" y="11" width="4" height="8" rx="1.5" />
              <rect x="30" y="11" width="4" height="8" rx="1.5" />
              <rect x="6" y="25" width="4" height="8" rx="1.5" />
              <rect x="30" y="25" width="4" height="8" rx="1.5" />
            </g>
            <rect x="9" y="7" width="22" height="28" rx="6" fill="var(--cs-robot)" />
            <path d="M 9 13 V 12 A 5 5 0 0 1 14 7 H 26 A 5 5 0 0 1 31 12 V 13 Z" fill="var(--cs-robot-dark)" />
            <circle cx="13.5" cy="10" r="1.6" fill="#fde68a" />
            <circle cx="26.5" cy="10" r="1.6" fill="#fde68a" />
            <circle cx="20" cy="22" r="6" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5" />
            <path class="cs-beam" d="M 20 22 L 20 16.6" stroke="var(--cs-accent)" stroke-width="2" stroke-linecap="round" />
            <circle cx="20" cy="22" r="1.5" fill="var(--cs-accent)" />
          </svg>
        </div>
      </div>

      <div class="cs-brand">
        <span class="cs-word">Compass</span>
        <span class="cs-bar"></span>
        <span class="cs-sub">Robot<br />Control</span>
      </div>
      <div class="cs-tagline" id="cs-splash-tagline"></div>
      <div class="cs-progress"></div>
      <div class="cs-status" id="cs-splash-status"></div>
    </div>

    <script>
      ;(function () {
        var el = document.getElementById('cs-splash')
        var status = document.getElementById('cs-splash-status')
        var started = Date.now()
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        // Минимальное время показа, мс: робот успевает проехать маршрут до конечной станции.
        var MIN_MS = reduced ? 0 : 6000

        // Язык и гамма — те же ключи, что у locales/index.js и useTheme.
        var get = function (key) {
          try {
            return localStorage.getItem(key)
          } catch (_) {
            return null
          }
        }
        var ru = (get('compass.locale') || ((navigator.language || '').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en')) === 'ru'
        var T = ru
          ? { label: 'Загрузка Compass', tagline: 'Управляй своим роботом', texts: ['Подключаемся к роботу', 'Получаем задание', 'Едем по маршруту', 'Робот готов'] }
          : { label: 'Loading Compass', tagline: 'Control your robot', texts: ['Connecting to robot', 'Receiving the order', 'Driving the route', 'Robot ready'] }
        var texts = T.texts
        document.documentElement.lang = ru ? 'ru' : 'en'
        el.setAttribute('aria-label', T.label)
        document.getElementById('cs-splash-tagline').textContent = T.tagline
        // Серая гамма (Настройки → Интерфейс) — логотип, полоса загрузки и робот серые, как в интерфейсе.
        if (get('compass.scheme') === 'gray') {
          var dark = document.documentElement.classList.contains('dark')
          el.style.setProperty('--cs-word-a', dark ? '#d4d8dd' : '#272b31')
          el.style.setProperty('--cs-word-b', dark ? '#8e959f' : '#6c737d')
          el.style.setProperty('--cs-robot', dark ? '#8e959f' : '#4b525c')
          el.style.setProperty('--cs-robot-dark', dark ? '#4b525c' : '#272b31')
        }

        // Подписи идут в такт анимации (цикл 7 с, см. cs-drive): граф, задание, езда, доехал.
        status.textContent = texts[0]
        var at = [0, 850, 1700, 5600]
        var timers = at.map(function (ms, i) {
          return setTimeout(function () {
            status.textContent = texts[i]
          }, ms)
        })

        window.__hideSplash = function () {
          window.__hideSplash = function () {}
          var wait = Math.max(0, MIN_MS - (Date.now() - started))
          setTimeout(function () {
            timers.forEach(clearTimeout)
            el.classList.add('is-leaving')
            setTimeout(function () {
              el.remove()
            }, 500)
          }, wait)
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
