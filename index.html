<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compass Robot Control</title>
    <script>
      // Тема до первого кадра (та же логика, что в useTheme), чтобы заставка
      // и интерфейс не мигали белым в тёмной теме.
      ;(function () {
        var mode = 'system'
        try {
          mode = localStorage.getItem('compass.theme') || 'system'
        } catch (_) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
    <style>
      /* Заставка при загрузке: робот строит карту, потом едет к цели.
         Цвета — из docs/DESIGN.md. Убирается из main.js (window.__hideSplash). */
      #cs-splash {
        --cs-bg: #f8fafc;
        --cs-grid: rgba(30, 64, 175, 0.07);
        --cs-dial: #cbd5e1;
        --cs-dial-major: #64748b;
        --cs-free: #ffffff;
        --cs-wall: #1e293b;
        --cs-scan: #ea580c;
        --cs-scan-soft: rgba(234, 88, 12, 0.32);
        --cs-nav: #059669;
        --cs-text: #64748b;
        --cs-word-a: #1e3a8a;
        --cs-word-b: #2563eb;
        --cs-track: #e2e8f0;
        --cs-accent: #f97316;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background:
          linear-gradient(var(--cs-grid) 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(90deg, var(--cs-grid) 1px, transparent 1px) 0 0 / 32px 32px,
          var(--cs-bg);
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 450ms ease, visibility 0s linear 450ms;
      }
      .dark #cs-splash {
        --cs-bg: #020617;
        --cs-grid: rgba(96, 165, 250, 0.06);
        --cs-dial: #1e293b;
        --cs-dial-major: #475569;
        --cs-free: #1e293b;
        --cs-wall: #e2e8f0;
        --cs-scan: #fb923c;
        --cs-scan-soft: rgba(251, 146, 60, 0.3);
        --cs-nav: #34d399;
        --cs-text: #94a3b8;
        --cs-word-a: #bfdbfe;
        --cs-word-b: #60a5fa;
        --cs-track: #1e293b;
      }
      /* Сетка гаснет к краям экрана. */
      #cs-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, transparent 0, transparent 260px, var(--cs-bg) 600px);
        pointer-events: none;
      }
      #cs-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
      }
      #cs-splash.is-leaving .cs-scene {
        transform: scale(1.06);
      }
      .cs-scene {
        position: relative;
        width: 320px;
        height: 320px;
        transition: transform 450ms ease;
      }
      .cs-scene svg {
        position: absolute;
        inset: 0;
        overflow: visible;
      }
      .cs-dial {
        transform-origin: 160px 160px;
        animation: cs-settle 2.4s cubic-bezier(0.3, 0.7, 0.3, 1) both;
      }
      /* Один 7-секундный цикл: 0–36 % картографирование, 36–44 % построение пути,
         44–80 % езда к цели, 80–92 % цель достигнута, дальше всё гаснет и по кругу. */
      .cs-reveal,
      .cs-map,
      .cs-robot,
      .cs-route,
      .cs-route path,
      .cs-goal,
      .cs-goal-ping {
        animation-duration: 7s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      .cs-reveal {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation-name: cs-reveal;
      }
      .cs-map {
        animation-name: cs-fade;
      }
      .cs-robot {
        position: absolute;
        top: 0;
        left: 0;
        width: 120px;
        height: 120px;
        offset-path: path('M 95 92 V 138 A 12 12 0 0 0 107 150 H 173 A 12 12 0 0 0 185 138 V 104 A 12 12 0 0 1 197 92 H 222 A 14 14 0 0 1 222 120 H 197 A 12 12 0 0 0 185 132 V 198 A 12 12 0 0 1 173 210 H 100');
        offset-anchor: 50% 50%;
        /* Спрайт робота смотрит вверх, поэтому к направлению пути +90°. */
        offset-rotate: auto 90deg;
        animation-name: cs-drive, cs-fade;
      }
      /* Лидар: оранжевый луч крутится вокруг робота, радиус = зона, которую «видит» карта. */
      .cs-lidar {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1px dashed var(--cs-scan-soft);
        background: conic-gradient(from 0deg, transparent 0deg, transparent 280deg, var(--cs-scan-soft) 358deg, var(--cs-scan) 360deg);
        -webkit-mask: radial-gradient(circle, #000 0, #000 58%, transparent 71%);
        mask: radial-gradient(circle, #000 0, #000 58%, transparent 71%);
        animation: cs-spin 0.9s linear infinite;
      }
      .cs-robot img {
        position: absolute;
        left: 41px;
        top: 41px;
        width: 38px;
        height: 38px;
        filter: drop-shadow(0 3px 4px rgba(15, 23, 42, 0.35));
        opacity: 0;
        transition: opacity 300ms ease;
      }
      .cs-robot img.is-ready {
        opacity: 1;
      }
      .cs-route {
        opacity: 0;
        animation-name: cs-route;
      }
      .cs-route path {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation-name: cs-draw;
      }
      .cs-goal {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-name: cs-goal;
      }
      .cs-goal-ping {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation-name: cs-ping;
      }
      .cs-brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        animation: cs-rise 600ms 150ms ease both;
      }
      .cs-word {
        font-family: Michroma, Inter, system-ui, sans-serif;
        font-size: 26px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background-image: linear-gradient(90deg, var(--cs-word-a), var(--cs-word-b));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .cs-bar {
        width: 3px;
        height: 30px;
        border-radius: 3px;
        background: var(--cs-accent);
      }
      .cs-sub {
        font-size: 11px;
        font-weight: 600;
        line-height: 1.15;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--cs-text);
      }
      .cs-progress {
        position: relative;
        width: 220px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--cs-track);
        animation: cs-rise 600ms 250ms ease both;
      }
      .cs-progress::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 3px;
        background: linear-gradient(90deg, transparent, var(--cs-word-b) 60%, var(--cs-accent));
        animation: cs-load 1.3s ease-in-out infinite;
      }
      .cs-status {
        position: relative;
        margin-top: -16px;
        min-height: 16px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: var(--cs-text);
        animation: cs-rise 600ms 300ms ease both;
      }
      @keyframes cs-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes cs-settle {
        0% { transform: rotate(-120deg); opacity: 0; }
        35% { transform: rotate(28deg); opacity: 1; }
        55% { transform: rotate(-12deg); }
        72% { transform: rotate(5deg); }
        86% { transform: rotate(-2deg); }
        100% { transform: rotate(0deg); }
      }
      /* 48.1 % — длина участка картографирования от всего пути робота.
         cs-drive и cs-reveal идут синхронно: карта открывается там, где проехал робот. */
      @keyframes cs-drive {
        0% { offset-distance: 0%; }
        36%, 44% { offset-distance: 48.1%; }
        80%, 100% { offset-distance: 100%; }
      }
      @keyframes cs-reveal {
        0% { stroke-dashoffset: 100; }
        36%, 44% { stroke-dashoffset: 51.9; }
        80%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes cs-fade {
        0%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes cs-route {
        0%, 36% { opacity: 0; }
        37%, 92% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes cs-draw {
        0%, 37% { stroke-dashoffset: 100; }
        44%, 100% { stroke-dashoffset: 0; }
      }
      @keyframes cs-goal {
        0%, 35% { opacity: 0; transform: translateY(-10px) scale(0.6); }
        38% { opacity: 1; transform: translateY(0) scale(1.15); }
        40%, 92% { opacity: 1; transform: none; }
        98%, 100% { opacity: 0; transform: none; }
      }
      @keyframes cs-ping {
        0%, 80% { opacity: 0; transform: scale(0.6); }
        81% { opacity: 0.9; transform: scale(0.6); }
        90%, 100% { opacity: 0; transform: scale(2.4); }
      }
      @keyframes cs-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes cs-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      /* Без анимации — сразу итог: карта построена, робот у цели. */
      @media (prefers-reduced-motion: reduce) {
        #cs-splash *,
        #cs-splash *::after {
          animation: none !important;
        }
        .cs-reveal { stroke-dashoffset: 0; }
        .cs-robot { offset-distance: 100%; }
        .cs-route, .cs-goal { opacity: 1; }
        .cs-route path { stroke-dashoffset: 0; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="cs-splash" role="status" aria-live="polite">
      <div class="cs-scene" aria-hidden="true">
        <svg width="320" height="320" viewBox="0 0 320 320">
          <defs>
            <!-- Что робот уже «увидел»: полоса шириной в дальность лидара вдоль пройденного пути -->
            <mask id="cs-seen" maskUnits="userSpaceOnUse" x="0" y="0" width="320" height="320">
              <circle cx="95" cy="92" r="60" fill="#fff" />
              <path
                class="cs-reveal"
                d="M 95 92 V 138 A 12 12 0 0 0 107 150 H 173 A 12 12 0 0 0 185 138 V 104 A 12 12 0 0 1 197 92 H 222 A 14 14 0 0 1 222 120 H 197 A 12 12 0 0 0 185 132 V 198 A 12 12 0 0 1 173 210 H 100"
                pathLength="100" fill="none" stroke="#fff" stroke-width="120" stroke-linecap="round" stroke-linejoin="round" />
            </mask>
          </defs>

          <!-- Циферблат компаса -->
          <g class="cs-dial">
            <circle cx="160" cy="160" r="154" fill="none" stroke="var(--cs-dial)" stroke-width="1.5" />
            <circle cx="160" cy="160" r="141" fill="none" stroke="var(--cs-dial)" stroke-width="1" stroke-dasharray="1.5 10.8" />
            <g stroke="var(--cs-dial-major)" stroke-width="2" stroke-linecap="round">
              <line x1="160" y1="6" x2="160" y2="18" stroke="var(--cs-accent)" />
              <line x1="314" y1="160" x2="302" y2="160" />
              <line x1="160" y1="314" x2="160" y2="302" />
              <line x1="6" y1="160" x2="18" y2="160" />
            </g>
            <path d="M160 -6 L166 4 H154 Z" fill="var(--cs-accent)" />
            <text x="160" y="34" text-anchor="middle" font-size="10" font-weight="700" fill="var(--cs-accent)" font-family="Inter, system-ui, sans-serif">N</text>
          </g>

          <!-- Карта комнаты: видна только там, куда дотянулся лидар -->
          <g class="cs-map" mask="url(#cs-seen)">
            <rect x="72" y="72" width="176" height="176" fill="var(--cs-free)" />
            <g fill="none" stroke="var(--cs-wall)" stroke-width="4" stroke-linecap="square">
              <rect x="70" y="70" width="180" height="180" />
              <line x1="160" y1="70" x2="160" y2="120" />
              <line x1="70" y1="175" x2="130" y2="175" />
            </g>
            <g fill="var(--cs-wall)">
              <rect x="207" y="160" width="27" height="30" rx="2" />
              <rect x="115" y="230" width="34" height="12" rx="2" />
            </g>
          </g>

          <!-- Путь Nav2 и цель -->
          <g class="cs-route" fill="none" stroke="var(--cs-nav)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 222 92 A 14 14 0 0 1 222 120 H 197 A 12 12 0 0 0 185 132 V 198 A 12 12 0 0 1 173 210 H 100" pathLength="100" />
          </g>
          <circle class="cs-goal-ping" cx="100" cy="210" r="9" fill="none" stroke="var(--cs-nav)" stroke-width="2" />
          <g class="cs-goal">
            <circle cx="100" cy="210" r="9" fill="none" stroke="var(--cs-nav)" stroke-width="2.5" />
            <circle cx="100" cy="210" r="3.5" fill="var(--cs-nav)" />
          </g>
        </svg>

        <div class="cs-robot">
          <div class="cs-lidar"></div>
          <img alt="" />
        </div>
      </div>

      <div class="cs-brand">
        <span class="cs-word">Compass</span>
        <span class="cs-bar"></span>
        <span class="cs-sub">Robot<br />Control</span>
      </div>
      <div class="cs-progress"></div>
      <div class="cs-status" id="cs-splash-status"></div>
    </div>

    <script>
      ;(function () {
        var el = document.getElementById('cs-splash')
        var status = document.getElementById('cs-splash-status')
        var started = Date.now()
        var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        // Минимальное время показа, мс: успевает построить карту и доехать до цели.
        var MIN_MS = reduced ? 0 : 6000

        // Картинку робота ставим из скрипта: путь в атрибуте src Vite в dev-режиме
        // может испортить (base подставляется дважды).
        var robot = el.querySelector('.cs-robot img')
        robot.onload = function () {
          robot.classList.add('is-ready')
        }
        robot.src = '%BASE_URL%splash/robot.svg'

        var texts = ['Connecting to robot', 'Building map', 'Planning route', 'Robot ready']
        el.setAttribute('aria-label', 'Loading Compass')

        // Подписи идут в такт анимации (цикл 7 с, см. cs-drive).
        status.textContent = texts[0]
        var at = [0, 1200, 2550, 5600]
        var timers = at.map(function (ms, i) {
          return setTimeout(function () {
            status.textContent = texts[i]
          }, ms)
        })

        window.__hideSplash = function () {
          window.__hideSplash = function () {}
          var wait = Math.max(0, MIN_MS - (Date.now() - started))
          setTimeout(function () {
            timers.forEach(clearTimeout)
            el.classList.add('is-leaving')
            setTimeout(function () {
              el.remove()
            }, 500)
          }, wait)
        }
      })()
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
